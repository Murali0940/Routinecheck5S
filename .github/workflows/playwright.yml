name: Playwright Java Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v6

      # 2. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Verify Java and Maven
      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      # 4. Build project and download Maven dependencies
      - name: Build project
        run: mvn -B clean install -DskipTests --no-transfer-progress

      # 5. Install Playwright browsers
      - name: Install Playwright browsers
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      # 6. Run TestNG + Playwright tests
      - name: Run Playwright tests
        run: mvn test

      # 7. Upload Allure results
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/

      # 8. Upload Surefire test results
      - name: Upload Surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/